[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# Sin esto, `pytest` a secas no encuentra el paquete `app` (solo funciona
# `python -m pytest`, que agrega el cwd al sys.path). Que dependa de cómo se
# invoque es justo el tipo de diferencia que hace pasar los tests en local y
# fallar en CI.
pythonpath = .
